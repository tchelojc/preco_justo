name: 🛒 Atualizar Preços — Supermercados RJ

on:
  schedule:
    # Executa às 8h e 16h no horário de Brasília (BRT)
    # Convertido para UTC: 11h e 19h
    - cron: '0 11,19 * * *'
  
  # Permite executar manualmente pela aba Actions do GitHub
  workflow_dispatch:

jobs:
  scrape-precos:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write   # Necessário para fazer git push dos JSONs

    steps:
      - name: 📥 Checkout do repositório
        uses: actions/checkout@v4

      - name: 🟢 Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: scripts/package-lock.json

      - name: 📦 Instalar dependências
        run: |
          cd scripts
          npm install

      - name: 🔍 Executar Scraper
        run: |
          cd scripts
          node scraper.js
        env:
          NODE_OPTIONS: '--max-old-space-size=512'

      - name: 💾 Commit e push dos dados atualizados
        run: |
          git config --global user.name  'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add dados/precos_cache/
          # Só commita se houver mudanças
          git diff --quiet && git diff --staged --quiet || \
            git commit -m "📊 Preços atualizados — $(TZ='America/Sao_Paulo' date +'%d/%m/%Y %H:%M') BRT"
          git push
