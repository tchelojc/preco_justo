<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <meta name="theme-color" content="#00843D">
  <title>Preço Justo · Detalhes do produto</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --verde: #00843D;
      --verde-esc: #005C2B;
      --amarelo: #FFD100;
      --cinza-bg: #F4F6FA;
      --cinza-card: #FFFFFF;
      --cinza-border: #E9EEF3;
      --texto-escuro: #1A2634;
      --texto-medio: #5A6E8A;
    }
    body {
      font-family: 'Inter', sans-serif;
      background: var(--cinza-bg);
      color: var(--texto-escuro);
      transition: font-size 0.2s;
    }
    body.modo-essencial { font-size: 18px; }
    body.modo-equilibrado { font-size: 17px; }
    body.modo-completo { font-size: 16px; }

    .container { max-width: 1200px; margin: 0 auto; padding: 20px 24px; }
    .top-bar { background: var(--verde); padding: 16px 24px; }
    .top-bar-inner { max-width: 1200px; margin: 0 auto; display: flex; align-items: center; gap: 20px; flex-wrap: wrap; }
    .btn-voltar { background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.3); color: white; padding: 10px 20px; border-radius: 50px; font-weight: 600; text-decoration: none; display: inline-flex; align-items: center; gap: 8px; }
    .logo { font-size: 1.5rem; font-weight: 800; color: white; }
    .logo span { color: var(--amarelo); }
    .btn-mudar-modo {
      background: rgba(255,255,255,0.2);
      border: none;
      padding: 8px 18px;
      border-radius: 40px;
      color: white;
      font-weight: 600;
      cursor: pointer;
    }

    .produto-header { background: white; border-radius: 20px; padding: 30px; margin: 24px 0; box-shadow: 0 2px 12px rgba(0,0,0,0.06); }
    .produto-categoria { display: inline-block; background: rgba(0,132,61,0.1); color: var(--verde); font-size: 0.75rem; font-weight: 700; padding: 4px 14px; border-radius: 30px; margin-bottom: 16px; }
    .produto-titulo { font-size: 2.5rem; font-weight: 800; margin-bottom: 8px; }
    .produto-embalagem { font-size: 1rem; color: var(--texto-medio); margin-bottom: 20px; }

    .melhor-preco-destaque { background: #F0FAF4; border-radius: 20px; padding: 24px; margin-top: 20px; border: 2px solid var(--verde); }
    .melhor-preco-valor-destaque { font-size: 3.5rem; font-weight: 800; color: var(--verde-esc); }

    .mercados-grid { display: grid; gap: 20px; margin-top: 24px; }
    body.modo-essencial .mercados-grid { grid-template-columns: 1fr; }
    body.modo-equilibrado .mercados-grid { grid-template-columns: repeat(auto-fill, minmax(350px, 1fr)); }
    body.modo-completo .mercados-grid { grid-template-columns: repeat(auto-fill, minmax(350px, 1fr)); }

    .mercado-card { background: white; border-radius: 20px; border: 1px solid var(--cinza-border); overflow: hidden; }
    .mercado-card.melhor { border: 2px solid var(--verde); background: #F0FAF4; }
    .mercado-header { padding: 20px; border-bottom: 1px solid var(--cinza-border); display: flex; align-items: center; gap: 12px; }
    .mercado-nome { font-size: 1.2rem; font-weight: 700; flex: 1; }
    .badge-melhor { background: var(--verde); color: white; padding: 4px 12px; border-radius: 30px; font-size: 0.7rem; }
    .mercado-body { padding: 20px; }
    .preco-mercado { font-size: 2.2rem; font-weight: 800; }
    .preco-unidade-mercado { font-size: 0.85rem; color: var(--texto-medio); margin: 8px 0 16px; }
    .foto-comprovante { margin: 12px 0; text-align: center; }
    .foto-comprovante img { max-width: 100%; max-height: 200px; border-radius: 16px; cursor: pointer; border: 1px solid var(--cinza-border); }
    .data-preco { font-size: 0.7rem; color: var(--texto-medio); margin-top: 8px; }
    .btn-ajudar {
      background: #eef2ff;
      color: #2b4c7c;
      border: 1px solid #cbd5e1;
      padding: 10px 16px;
      border-radius: 40px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
      width: 100%;
      margin-top: 16px;
    }
    .btn-ajudar:hover { background: #e2e8f0; transform: scale(1.02); }
    .economia-badge { background: #E31E26; color: white; padding: 4px 12px; border-radius: 30px; font-size: 0.75rem; margin-left: 8px; display: inline-block; }

    .loading-spinner { border: 4px solid #e2e8f0; border-top-color: var(--verde); width: 50px; height: 50px; border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .ultima-atualizacao { text-align: center; margin-top: 30px; font-size: 0.8rem; }

    /* MODAL DE ENVIO DE PREÇO (igual ao index) */
    .modal-preco {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      backdrop-filter: blur(8px);
      z-index: 2100;
      justify-content: center;
      align-items: center;
    }
    .modal-preco-content {
      background: white;
      max-width: 500px;
      width: 90%;
      border-radius: 32px;
      padding: 28px;
      position: relative;
    }
    .modal-preco-content h3 { margin-bottom: 20px; color: var(--verde); }
    .modal-preco-content input, .modal-preco-content button, .modal-preco-content select {
      width: 100%;
      padding: 14px;
      margin: 10px 0;
      border-radius: 60px;
      border: 1px solid var(--cinza-border);
      font-size: 1rem;
    }
    .modal-preco-content button {
      background: var(--verde);
      color: white;
      font-weight: bold;
      cursor: pointer;
      border: none;
    }
    .foto-preview { width: 100%; margin-top: 12px; border-radius: 20px; display: none; }
    .close-modal {
      position: absolute;
      top: 16px;
      right: 20px;
      font-size: 1.8rem;
      cursor: pointer;
      color: var(--texto-medio);
    }
  </style>
</head>
<body>

<header class="top-bar">
  <div class="top-bar-inner">
    <a href="index.html" class="btn-voltar"><i class="fas fa-arrow-left"></i> Voltar</a>
    <div class="logo">Preço<span>Justo</span></div>
    <button id="mudarModoBtn" class="btn-mudar-modo"><i class="fas fa-sliders-h"></i> Modo</button>
  </div>
</header>

<main class="container">
  <div id="produtoContainer">
    <div class="loading-spinner"></div>
    <p style="text-align:center; margin-top:16px;">Carregando detalhes...</p>
  </div>
</main>

<!-- MODAL DE ENVIO DE PREÇO (reutilizado do index) -->
<div id="modalEnvioPreco" class="modal-preco">
  <div class="modal-preco-content">
    <span class="close-modal" id="fecharModalPreco">&times;</span>
    <h3><i class="fas fa-camera"></i> Ajudar com preço</h3>
    <p id="infoProdutoMercado"></p>
    <input type="number" id="precoInput" step="0.01" placeholder="Preço (ex: 4,99)" required>
    <label style="display:block; margin:8px 0 4px;">📸 Foto da etiqueta (obrigatória):</label>
    <input type="file" id="fotoInput" accept="image/*" capture="environment">
    <img id="fotoPreview" class="foto-preview" alt="Prévia da foto">
    <button id="btnEnviarPreco">Enviar preço e ajudar</button>
    <p class="small-text" style="margin-top:12px; font-size:0.7rem;">A foto ajuda a validar o preço. Só serão aceitos envios entre 8h e 16h.</p>
  </div>
</div>

<script>
  // ========== CONFIGURAÇÃO ==========
  const BACKEND_URL = 'https://script.google.com/macros/s/AKfycbzOc79mQE9BP2h1LH6wzpkIpwPoVBSlqIlpYPUKhDzl1BVU6JUJiG4PvdYfmYXYyq3V/exec';
  const IMGBB_API_KEY = '2597fbdd4014975ed01d56ee9a6b404d'; // mesma chave

  let modoAtual = 'essencial';
  let produtoAtual = null;
  let precosCompletos = null;

  // ========== FUNÇÕES DE COMUNICAÇÃO ==========
  async function fetchGET(action, params = {}) {
    const query = new URLSearchParams({ action, ...params }).toString();
    const url = `${BACKEND_URL}?${query}`;
    const res = await fetch(url);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const json = await res.json();
    if (json.erro) throw new Error(json.erro);
    return json;
  }

  async function fetchPOST(acao, dados) {
    const formData = new URLSearchParams();
    formData.append('data', JSON.stringify({ acao, dados }));
    const res = await fetch(BACKEND_URL, { method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' }, body: formData.toString() });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const json = await res.json();
    if (!json.ok) throw new Error(json.erro || 'Erro no servidor');
    return json;
  }

  async function obterPrecosProdutoCompleto(produtoId) {
    return await fetchGET('precos_produto_completo', { produto: produtoId });
  }

  async function salvarPreco(dados) { return await fetchPOST('enviar_preco', dados); }

  // ========== UPLOAD DE IMAGEM (IMG.BB) ==========
  function compressImage(base64, maxWidth = 800, quality = 0.7, callback) {
    const img = new Image();
    img.onload = () => {
      let width = img.width, height = img.height;
      if (width > maxWidth) { height = (height * maxWidth) / width; width = maxWidth; }
      const canvas = document.createElement('canvas');
      canvas.width = width; canvas.height = height;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, width, height);
      callback(canvas.toDataURL('image/jpeg', quality));
    };
    img.src = base64;
  }

  async function uploadParaImgBB(base64Image) {
    let imageData = base64Image;
    if (base64Image.includes(',')) imageData = base64Image.split(',')[1];
    const formData = new FormData();
    formData.append('key', IMGBB_API_KEY);
    formData.append('image', imageData);
    const response = await fetch('https://api.imgbb.com/1/upload', { method: 'POST', body: formData });
    const result = await response.json();
    if (result.success) return result.data.url;
    throw new Error(result.error?.message || 'Falha no upload');
  }

  async function uploadImageToHost(file, maxWidth = 800, quality = 0.7) {
    return new Promise((resolve, reject) => {
      if (file.size > 5 * 1024 * 1024) reject(new Error('Imagem muito grande. Máximo 5MB.'));
      const reader = new FileReader();
      reader.onload = (ev) => compressImage(ev.target.result, maxWidth, quality, async (compressed) => {
        try { resolve(await uploadParaImgBB(compressed)); } catch (err) { reject(err); }
      });
      reader.onerror = () => reject(new Error('Erro ao ler o arquivo'));
      reader.readAsDataURL(file);
    });
  }

  // ========== GERENCIAMENTO DE MODO ==========
  function carregarModo() {
    const salvo = localStorage.getItem('precojusto_modo');
    if (salvo && ['essencial', 'equilibrado', 'completo'].includes(salvo)) modoAtual = salvo;
    else modoAtual = 'essencial';
    document.body.classList.add(`modo-${modoAtual}`);
  }
  function aplicarModo() {
    document.body.classList.remove('modo-essencial', 'modo-equilibrado', 'modo-completo');
    document.body.classList.add(`modo-${modoAtual}`);
    localStorage.setItem('precojusto_modo', modoAtual);
    if (produtoAtual && precosCompletos) renderizarDetalhes(produtoAtual, precosCompletos);
  }
  function mudarModo() {
    let novo = 'essencial';
    if (modoAtual === 'essencial') novo = 'equilibrado';
    else if (modoAtual === 'equilibrado') novo = 'completo';
    else novo = 'essencial';
    modoAtual = novo;
    aplicarModo();
  }
  document.getElementById('mudarModoBtn').addEventListener('click', mudarModo);

  // ========== CARREGAR DETALHES ==========
  async function carregarDetalhes() {
    const params = new URLSearchParams(window.location.search);
    const produtoId = params.get('id');
    if (!produtoId) { window.location.href = 'index.html'; return; }

    try {
      const dadosCompletos = await obterPrecosProdutoCompleto(produtoId);
      produtoAtual = {
        id: dadosCompletos.produto_id,
        nome_canonico: dadosCompletos.produto_nome,
        categoria: dadosCompletos.produto_categoria,
        embalagem: dadosCompletos.produto_embalagem,
        unidade_medida: 'kg' // ou extrair do produto, mas o endpoint não retorna; usaremos padrão
      };
      precosCompletos = dadosCompletos;
      renderizarDetalhes(produtoAtual, dadosCompletos);
    } catch (error) {
      document.getElementById('produtoContainer').innerHTML = `<div style="text-align:center; padding:60px;">Erro: ${error.message}<br><a href="index.html">Voltar</a></div>`;
    }
  }

  function renderizarDetalhes(produto, dados) {
    const resultados = dados.resultados || [];
    const temResultados = resultados.some(r => r.preco !== null);
    const melhor = resultados.filter(r => r.preco !== null).sort((a,b) => a.preco - b.preco)[0];
    const isEssencial = modoAtual === 'essencial';
    const isCompleto = modoAtual === 'completo';
    const mostrarBotaoAjudar = (modoAtual === 'equilibrado' || modoAtual === 'completo');

    let html = `
      <div class="produto-header">
        <span class="produto-categoria">${produto.categoria}</span>
        <h1 class="produto-titulo">${produto.nome_canonico}</h1>
        <p class="produto-embalagem">${produto.embalagem} · Preço por kg</p>
    `;
    if (melhor) {
      html += `
        <div class="melhor-preco-destaque">
          <div class="melhor-preco-label">🏆 Melhor preço encontrado</div>
          <div class="melhor-preco-valor-destaque">R$ ${melhor.preco.toFixed(2).replace('.', ',')}</div>
          <div style="margin-top: 12px;"><i class="fas fa-store"></i> ${melhor.mercado_nome}</div>
          ${isCompleto && melhor.fotoUrl ? `<div><a href="${melhor.fotoUrl}" target="_blank">📸 Ver comprovante</a></div>` : ''}
        </div>
      `;
    }
    html += `</div>`;

    if (temResultados) {
      html += `<div class="mercados-grid">`;
      resultados.forEach(mercado => {
        const temPreco = mercado.preco !== null;
        const ehMelhor = melhor && mercado.mercado_id === melhor.mercado_id;
        const economia = (melhor && temPreco && !ehMelhor) ? (mercado.preco - melhor.preco).toFixed(2) : null;
        const dataFormatada = mercado.dataHora ? new Date(mercado.dataHora).toLocaleString('pt-BR') : '';
        html += `
          <div class="mercado-card ${ehMelhor ? 'melhor' : ''}">
            <div class="mercado-header" style="border-left: 4px solid ${mercado.mercado_cor || '#00843D'}">
              <span class="mercado-logo">${mercado.mercado_logo || '🛒'}</span>
              <span class="mercado-nome">${mercado.mercado_nome}</span>
              ${ehMelhor ? '<span class="badge-melhor">Melhor</span>' : ''}
            </div>
            <div class="mercado-body">
              <div class="preco-mercado">
                ${temPreco ? `R$ ${mercado.preco.toFixed(2).replace('.', ',')}` : '— sem preço —'}
                ${economia && parseFloat(economia) > 0 ? `<span class="economia-badge">+R$ ${economia.replace('.', ',')}</span>` : ''}
              </div>
              ${isCompleto && temPreco && mercado.fotoUrl ? `
                <div class="foto-comprovante">
                  <a href="${mercado.fotoUrl}" target="_blank"><img src="${mercado.fotoUrl}" alt="Comprovante" loading="lazy"></a>
                </div>
              ` : ''}
              ${dataFormatada ? `<div class="data-preco"><i class="far fa-clock"></i> Atualizado em ${dataFormatada} por ${mercado.usuarioNome || 'anonimo'}</div>` : ''}
              ${mostrarBotaoAjudar ? `<button class="btn-ajudar" data-produto='${JSON.stringify(produto)}' data-mercado='${JSON.stringify(mercado)}'>📸 Ajudar com preço</button>` : ''}
            </div>
          </div>
        `;
      });
      html += `</div>`;
    } else {
      html += `<div style="text-align:center; padding:60px;">Ainda não há preços disponíveis para este produto. Seja o primeiro a ajudar!</div>`;
      if (mostrarBotaoAjudar) {
        html += `<div style="text-align:center; margin-top:20px;"><button id="ajudarPrimeiroBtn" class="btn-ajudar" style="width:auto; display:inline-block;">📸 Ajudar com preço</button></div>`;
      }
    }

    const dataConsulta = dados.consultado_em ? new Date(dados.consultado_em).toLocaleString('pt-BR') : '';
    html += `<div class="ultima-atualizacao">🕒 Última atualização: ${dataConsulta}</div>`;
    document.getElementById('produtoContainer').innerHTML = html;

    // Adiciona eventos aos botões de ajuda
    document.querySelectorAll('.btn-ajudar').forEach(btn => {
      btn.addEventListener('click', (e) => {
        const produto = JSON.parse(btn.dataset.produto);
        const mercado = JSON.parse(btn.dataset.mercado);
        abrirModalEnvio(produto, mercado);
      });
    });
    const ajudarPrimeiro = document.getElementById('ajudarPrimeiroBtn');
    if (ajudarPrimeiro) {
      ajudarPrimeiro.addEventListener('click', () => {
        abrirModalEnvio(produto, { mercado_nome: 'todos os mercados', mercado_id: null });
      });
    }
  }

  // ========== MODAL DE ENVIO DE PREÇO ==========
  let produtoModal = null;
  let mercadoModal = null;

  function abrirModalEnvio(produto, mercado) {
    produtoModal = produto;
    mercadoModal = mercado;
    const modal = document.getElementById('modalEnvioPreco');
    const info = document.getElementById('infoProdutoMercado');
    if (mercado.mercado_id) {
      info.innerHTML = `<strong>${produto.nome_canonico}</strong><br>Mercado: ${mercado.mercado_nome}`;
      // Cria um campo hidden ou apenas exibe o mercado fixo
      if (!document.getElementById('mercadoIdFixed')) {
        const inputHidden = document.createElement('input');
        inputHidden.type = 'hidden';
        inputHidden.id = 'mercadoIdFixed';
        inputHidden.value = mercado.mercado_id;
        info.appendChild(inputHidden);
      } else {
        document.getElementById('mercadoIdFixed').value = mercado.mercado_id;
      }
    } else {
      // Para "ajudar primeiro", precisa selecionar o mercado
      info.innerHTML = `<strong>${produto.nome_canonico}</strong><br>Escolha o mercado:`;
      let selectHtml = `<select id="selectMercadoEnvio" style="width:100%; padding:12px; margin:8px 0; border-radius:60px;">`;
      // Buscar lista de mercados do backend (poderia ser passada, mas faremos fetch)
      fetchGET('mercados').then(mercados => {
        mercados.filter(m => m.ativo).forEach(m => selectHtml += `<option value="${m.id}">${m.logo} ${m.nome}</option>`);
        selectHtml += `</select>`;
        info.innerHTML += selectHtml;
      }).catch(() => {});
    }
    modal.style.display = 'flex';
    document.getElementById('precoInput').value = '';
    document.getElementById('fotoInput').value = '';
    document.getElementById('fotoPreview').style.display = 'none';
  }

  document.getElementById('fecharModalPreco').onclick = () => document.getElementById('modalEnvioPreco').style.display = 'none';
  document.getElementById('fotoInput').addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (file) {
      const reader = new FileReader();
      reader.onload = (ev) => {
        const preview = document.getElementById('fotoPreview');
        preview.src = ev.target.result;
        preview.style.display = 'block';
      };
      reader.readAsDataURL(file);
    }
  });

  document.getElementById('btnEnviarPreco').onclick = async () => {
    const preco = parseFloat(document.getElementById('precoInput').value.replace(',', '.'));
    if (isNaN(preco) || preco <= 0) { alert('Informe um preço válido.'); return; }
    let mercadoId = mercadoModal?.mercado_id;
    if (!mercadoId) {
      const select = document.getElementById('selectMercadoEnvio');
      if (select) mercadoId = select.value;
      else { alert('Selecione um mercado.'); return; }
    }
    const fotoFile = document.getElementById('fotoInput').files[0];
    if (!fotoFile) { alert('Tire uma foto da etiqueta do preço.'); return; }

    let usuarioNome = localStorage.getItem('precojusto_nome');
    if (!usuarioNome) {
      usuarioNome = prompt('Para ajudar, digite seu nome (ou clique em Cancelar para continuar anônimo):');
      if (usuarioNome && usuarioNome.trim()) localStorage.setItem('precojusto_nome', usuarioNome.trim());
      else usuarioNome = 'Anônimo';
    }

    try {
      const fotoUrl = await uploadImageToHost(fotoFile, 800, 0.7);
      const dadosEnvio = {
        produtoId: produtoModal.id,
        mercadoId: mercadoId,
        preco: preco,
        fotoUrl: fotoUrl,
        usuarioId: usuarioNome + '@precojusto',
        usuarioNome: usuarioNome
      };
      const resultado = await salvarPreco(dadosEnvio);
      if (resultado.ok) {
        alert('Preço enviado com sucesso! Obrigado por ajudar a comunidade.');
        document.getElementById('modalEnvioPreco').style.display = 'none';
        // Recarrega os detalhes do produto
        carregarDetalhes();
      } else throw new Error(resultado.erro);
    } catch (err) {
      console.error(err);
      alert('Erro ao enviar: ' + err.message);
    }
  };

  // Inicialização
  carregarModo();
  carregarDetalhes();
</script>
</body>
</html>
