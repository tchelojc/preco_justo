name: 🛒 Atualizar Preços — Supermercados RJ

on:
  schedule:
    - cron: '0 11,19 * * *'
  workflow_dispatch:

jobs:
  scrape-precos:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: node scraper.js
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add dados/precos_cache/
          git diff --quiet || git commit -m "📊 Preços atualizados"
          git push
