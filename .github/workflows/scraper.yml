name: 🛒 Atualizar Preços — Supermercados RJ

on:
  schedule:
    # 8h e 16h BRT (11 e 19 UTC)
    - cron: '0 11,19 * * *'
  workflow_dispatch:

jobs:
  scrape-precos:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 📥 Checkout do repositório
        uses: actions/checkout@v4

      - name: 🟢 Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # SEM npm install — o scraper v2 usa apenas módulos nativos do Node.js
      # (https, http, fs, path) — zero dependências externas

      - name: 🔍 Executar Scraper
        run: node scraper.js
        env:
          NODE_OPTIONS: '--max-old-space-size=512'

      - name: 💾 Commit e push dos dados atualizados
        run: |
          git config --global user.name  'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add dados/precos_cache/
          git diff --quiet && git diff --staged --quiet || \
            git commit -m "📊 Preços — $(TZ='America/Sao_Paulo' date +'%d/%m/%Y %H:%M') BRT"
          git push
